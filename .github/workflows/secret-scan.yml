# Secret scanning CI — blocks accidental leaks of credentials/keys.
# CI 金鑰掃描 — 防止憑證、金鑰意外進入 repo。
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history scan (Mon 03:00 UTC) / 每週一次全歷史掃描
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so historical commits are scanned too
          # 抓完整歷史,連同過去的 commit 一起掃
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
